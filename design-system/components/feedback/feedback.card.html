<!-- @dsCard group="Components" viewport="700x660" name="Feedback & overlay" subtitle="Dialog, banners, toast, tabs, status chips, empty state, pagination" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px 24px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function mount(){
  const NS=window.MomentumTennisDesignSystem_0ea6ac;
  if(!(NS&&NS.Dialog&&NS.Banner&&NS.Toast&&NS.Tabs&&NS.StatusChip&&NS.EmptyState&&NS.Pagination&&NS.Button)){setTimeout(mount,200);return;}
  const {Dialog,Banner,Toast,Tabs,StatusChip,EmptyState,Pagination,Button}=NS;
  const lbl={fontFamily:'var(--font-sans)',fontSize:'var(--size-label-sm)',fontWeight:700,letterSpacing:'var(--track-label)',textTransform:'uppercase',color:'var(--text-secondary)'};
  function App(){
    const [dlg,setDlg]=React.useState(false);
    const [toast,setToast]=React.useState(false);
    const [tab,setTab]=React.useState('stats');
    const [pg,setPg]=React.useState(1);
    return <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div><div style={{...lbl,marginBottom:10}}>Status chips</div>
        <div style={{display:'flex',gap:18,flexWrap:'wrap'}}>{['ACTIVE','UPCOMING','WAITLISTED','CANCELLED','PAID','REFUNDED','SIGNED','NEEDS RE-CONSENT','DRAFT'].map(s=><StatusChip key={s} status={s}/>)}</div></div>
      <Banner tone="error" action={<Button variant="secondary" size="sm">Review & sign</Button>}>Dev R. needs re-consent — liability waiver V3. Booking is paused.</Banner>
      <Banner>Times shown are Pacific. The academy sets class times each season.</Banner>
      <div style={{display:'flex',gap:24,alignItems:'center',flexWrap:'wrap'}}>
        <Tabs items={[{id:'stats',label:'Stats'},{id:'cal',label:'Calendar'},{id:'store',label:'Store'}]} active={tab} onChange={setTab} style={{flex:1}}/>
        <Pagination page={pg} pages={4} onChange={setPg}/>
      </div>
      <div style={{border:'var(--hairline)'}}><EmptyState ticks>No sessions on this day — courts rest on Wed &amp; Fri</EmptyState></div>
      <div style={{display:'flex',gap:12}}>
        <Button variant="secondary" size="sm" onClick={()=>setDlg(true)}>Open destructive confirm</Button>
        <Button variant="ghost" size="sm" onClick={()=>setToast(true)}>Show toast</Button>
      </div>
      <Dialog open={dlg} onClose={()=>setDlg(false)} title="Cancel session" consequence="CANCELLING NOTIFIES 6 BOOKED FAMILIES — THIS CANNOT BE UNDONE"
        actions={<React.Fragment><Button variant="ghost" onClick={()=>setDlg(false)}>Keep session</Button><Button variant="secondary" style={{color:'var(--state-error)',borderColor:'var(--state-error)'}} onClick={()=>setDlg(false)}>Cancel session</Button></React.Fragment>}>
        <p style={{margin:0,fontFamily:'var(--font-sans)',fontSize:'var(--size-body-sm)',lineHeight:1.55,color:'var(--ink)'}}>Green ball · Thu Sep 17 · 17:00–18:30 · Murdock Park. Booked families are notified and their credits are returned.</p>
      </Dialog>
      <Toast open={toast} onDismiss={()=>setToast(false)}>Attendance saved · 8 / 10</Toast>
    </div>;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script></body></html>
