<!-- @dsCard group="Type" viewport="700x210" name="Data — IBM Plex Mono" subtitle="Annotation, times, scores — the analysis layer" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px 28px;background:var(--surface-card);font-family:var(--font-mono);color:var(--ink)}.grid{display:grid;grid-template-columns:auto auto auto;gap:14px 40px;font-size:13px;line-height:1.45}.k{color:var(--text-secondary);font-size:11px;letter-spacing:.107em;text-transform:uppercase}.v{font-size:15px}.tag{display:inline-block;background:var(--court-800);color:var(--line-white);padding:4px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.note{font-size:12px;color:var(--text-secondary);margin-top:18px}</style>
</head><body>
<div class="grid">
<div><div class="k">Timestamp</div><div class="v">SAT 09:00–11:00</div></div>
<div><div class="k">Match score</div><div class="v">6–4 · 3–6 · 10–7</div></div>
<div><div class="k">Frame label</div><div class="v">t−3 t−2 t−1 t0</div></div>
<div><div class="k">Location</div><div class="v">DE ANZA COLLEGE</div></div>
<div><div class="k">Level</div><div class="v">ORANGE → YELLOW</div></div>
<div><div class="k">Photo tag</div><div class="v"><span class="tag">MURDOCK · THU 17:00</span></div></div>
</div>
<div class="note">MONO CARRIES EVERY NUMBER, TIME, SCORE AND OVERLAY. IT ANNOTATES — IT NEVER PERSUADES.</div>
</body></html>
