<!-- @dsCard group="Colors" viewport="700x210" name="Court blues" subtitle="Anchor tuned against sampled court pixels; every light blue is a derived tint" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-card)}.ramp{display:flex;height:110px}.s{flex:1;position:relative}.s span{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:10.5px;line-height:1.5}.anchor{flex:1.9}.note{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);margin-top:12px}</style>
</head><body>
<div class="ramp">
<div class="s" style="background:var(--court-050)"><span style="color:var(--court-800)">050<br>#EEF3F7</span></div>
<div class="s" style="background:var(--court-100)"><span style="color:var(--court-800)">100<br>#DCE6EE</span></div>
<div class="s" style="background:var(--court-200)"><span style="color:var(--court-800)">200<br>#A9BDC9</span></div>
<div class="s" style="background:var(--court-300)"><span style="color:var(--court-900)">300 ghost<br>#7FA3C4</span></div>
<div class="s" style="background:var(--court-400)"><span style="color:var(--line-white)">400<br>#3E6C99</span></div>
<div class="s anchor" style="background:var(--court-500)"><span style="color:var(--line-white)">500 ANCHOR<br>#2B5680</span></div>
<div class="s" style="background:var(--court-700)"><span style="color:var(--line-white)">700<br>#24466B</span></div>
<div class="s" style="background:var(--court-800)"><span style="color:var(--line-white)">800 field<br>#1C3655</span></div>
<div class="s" style="background:var(--court-900)"><span style="color:var(--line-white)">900<br>#12253B</span></div>
</div>
<div class="note">ACRYLIC HARD-COURT BLUE — THE GROUND THE STUDENTS STAND ON. SAMPLED: SHADOWED COURT #224263–#314E66, SUNLIT #7FA3C4. LEGACY #87CEFA IS BANNED.</div>
</body></html>
