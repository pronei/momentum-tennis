<!-- @dsCard group="Shape & Motion" viewport="700x200" name="The shape law" subtitle="One radius: the action pill. Everything else is square." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-card);display:flex;gap:28px;align-items:center}.pill{height:48px;padding:0 28px;border-radius:999px;background:var(--amber-500);color:var(--ink);display:inline-flex;align-items:center;font-family:var(--font-sans);font-size:13px;font-weight:700;letter-spacing:.107em;text-transform:uppercase}.sq{width:130px;height:88px;border:var(--hairline);background:var(--court-050);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.note{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);max-width:24ch;line-height:1.7}</style>
</head><body>
<span class="pill">Actions · 999px</span>
<div class="sq">CARDS · 0</div>
<div class="sq" style="background:var(--court-800);color:var(--court-200);border:0">PHOTOS · 0</div>
<div class="note">THE PILL IS THE PATH A CIRCLE SWEEPS THROUGH TIME. NOTHING ELSE EARNS A RADIUS.</div>
</body></html>
