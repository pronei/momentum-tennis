# Cloudflare Workers config for the SvelteKit app. Two projects deploy this same config from
# their own branches (Workers Builds): momentum-tennis-dev ← deploy/dev, momentum-tennis ← deploy/live.
# Secrets are set per project (wrangler secret put / dashboard), never here. See README.md.
name = "momentum-tennis"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true

# `wrangler deploy --env dev` / `--env live` when deploying by hand.
[env.dev]
name = "momentum-tennis-dev"
# Public runtime values (not secrets). $env/dynamic/private reads the worker's vars, not the .env
# file the build read, so anything the app demands at request time and is not PUBLIC_* lives here.
[env.dev.vars]
EMAIL_FROM = "Momentum Tennis (dev) <onboarding@resend.dev>"

[env.live]
name = "momentum-tennis"
[env.live.vars]
EMAIL_FROM = "Momentum Tennis <no-reply@momentum-tennis.com>" # confirm against the verified Resend domain at launch
