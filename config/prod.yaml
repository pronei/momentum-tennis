# Momentum Tennis — production environment profile.
#
# Same shape as config/dev.yaml. Real families, real money, real consent records.
# Migrations reach here only after they have run on dev.
#
# Verify this profile agrees with the env file:  pnpm env:check
# Build for this environment:                    pnpm build:live
# Step-by-step setup:                            docs/OPERATIONS.md
name: prod
description: Live academy. Real family data. Migrations arrive dev-first, never directly.
env_file: .env.production

supabase:
  project_ref: TODO # fill when the production project exists
  url: TODO
  plan: pro # required before phase 5: Free has no backups and pauses after 7 idle days
  pooler: TODO_pooler_host # dashboard → Connect → Session pooler, e.g. aws-0-us-west-1
  migrations_applied_by: 'connect the Supabase GitHub integration to deploy/live, or migrate.yml (Run workflow) / `pnpm db:push prod`'

cloudflare:
  account_id: TODO # the same account as dev, confirmed with `wrangler whoami`
  worker: momentum-tennis
  cron_worker: momentum-tennis-cron
  deploy_branch: deploy/live
  access_protected: false # public site

deploy:
  build: pnpm build:live
  command: npx wrangler deploy --env live
  site_url: https://momentum-tennis.com # decision J: app.momentum-tennis.com first, root cutover later

stripe:
  mode: live

secrets:
  - name: SUPABASE_SECRET_KEY
    needed_from: phase 5 (webhooks) and 7 (cron)
  - name: STRIPE_SECRET_KEY
    needed_from: phase 5
  - name: STRIPE_WEBHOOK_SECRET
    needed_from: phase 5
  - name: RESEND_API_KEY
    needed_from: phase 4 / 7
  - name: CRON_SHARED_SECRET
    needed_from: phase 7

ci_secrets: # migrate.yml — `pnpm db:push prod` needs only the database password
  - SUPABASE_DB_PASSWORD_PROD # also in .env.local for `pnpm db:push prod`
