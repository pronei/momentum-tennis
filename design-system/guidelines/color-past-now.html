<!-- @dsCard group="Colors" viewport="700x170" name="Past is cool, now is warm" subtitle="The color law every strobe treatment follows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-field)}.seq{display:flex;gap:10px;align-items:flex-end}.f{flex:1;position:relative}.f i{display:block;border-radius:50%;width:100%;padding-top:100%}.f span{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 8px);font-family:var(--font-mono);font-size:11px;color:var(--court-200)}.f:last-child span{color:var(--amber-300)}</style>
</head><body>
<div class="seq">
<div class="f"><i style="background:var(--court-700)"></i><span>t−7</span></div>
<div class="f"><i style="background:var(--court-500)"></i><span>t−6</span></div>
<div class="f"><i style="background:var(--court-400)"></i><span>t−5</span></div>
<div class="f"><i style="background:#5B84AC"></i><span>t−4</span></div>
<div class="f"><i style="background:var(--court-300)"></i><span>t−3</span></div>
<div class="f"><i style="background:var(--court-200)"></i><span>t−2</span></div>
<div class="f"><i style="background:var(--court-100)"></i><span>t−1</span></div>
<div class="f"><i style="background:var(--now)"></i><span>t0 · NOW</span></div>
</div>
</body></html>
