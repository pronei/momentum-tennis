<!-- @dsCard group="Shape & Motion" viewport="700x210" name="Focus & motion" subtitle="Visible keyboard focus; frames advance, nothing floats; reduced-motion honored" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-card);display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.demo{display:flex;gap:18px;align-items:center}.pill{height:44px;padding:0 24px;border-radius:999px;border:1.5px solid var(--ink);display:inline-flex;align-items:center;font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.107em;text-transform:uppercase;color:var(--ink);background:none}.f1{outline:2px solid var(--focus-on-light);outline-offset:2px}.dk{background:var(--court-800);padding:14px 18px;display:inline-flex}.pilld{border-color:var(--line-white);color:var(--line-white)}.f2{outline:2px solid var(--focus-on-dark);outline-offset:2px}.note{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);line-height:1.9}</style>
</head><body>
<div class="demo"><button class="pill f1">On light</button><span class="dk"><button class="pill pilld f2">On field</button></span></div>
<div class="note">FOCUS: 2PX RING, OFFSET 2 — COURT-500 ON LIGHT, AMBER ON FIELD.<br>MOTION: 120–320MS, EASE-OUT, TRANSFORMS ≤4PX.<br>PREFERS-REDUCED-MOTION COLLAPSES ALL ANIMATION (BASE.CSS).</div>
</body></html>
