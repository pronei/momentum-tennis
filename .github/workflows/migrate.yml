name: Migrate database

# Migrations apply dev-first, prod on release: each deploy branch pushes to its own Supabase project.
# Required repository secrets: SUPABASE_ACCESS_TOKEN, and per environment
# SUPABASE_PROJECT_REF_DEV / SUPABASE_DB_PASSWORD_DEV and SUPABASE_PROJECT_REF_LIVE / SUPABASE_DB_PASSWORD_LIVE.
on:
  push:
    branches: [deploy/dev, deploy/live]
    paths: ['supabase/migrations/**', 'supabase/seed.sql']

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Select environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "deploy/live" ]; then
            echo "PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF_LIVE }}" >> "$GITHUB_ENV"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD_LIVE }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF_DEV }}" >> "$GITHUB_ENV"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD_DEV }}" >> "$GITHUB_ENV"
          fi
      - run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
      - run: supabase db push --password "$DB_PASSWORD"
