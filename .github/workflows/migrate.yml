name: Migrate database

# Manual fallback for applying supabase/migrations. The automatic writer is the Supabase GitHub
# integration (dashboard → Integrations → GitHub), connected with production branch deploy/dev:
# Supabase applies migrations itself on every push there. Two writers on one push would race,
# so this workflow runs on demand only — Actions → Migrate database → Run workflow, choosing the
# branch (deploy/dev → config/dev.yaml, deploy/live → config/prod.yaml). Use it for an environment
# without the integration, or to re-run after a failure.
#
# It runs `pnpm db:push <profile>` and needs one repository secret per environment — the database
# password (SUPABASE_DB_PASSWORD_DEV / SUPABASE_DB_PASSWORD_PROD). Project ref and pooler host are
# public facts in config/*.yaml; the pooler is used because GitHub-hosted runners have no IPv6.
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD_DEV: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      SUPABASE_DB_PASSWORD_PROD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4
      - name: Select environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "deploy/live" ]; then profile=prod; else profile=dev; fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          key="SUPABASE_DB_PASSWORD_$(echo "$profile" | tr a-z A-Z)"
          # Until the operator adds the secret (docs/OPERATIONS.md §1) this job skips with a
          # notice instead of failing — a missing password is a setup state, not a broken build.
          if [ -z "${!key}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migrations skipped::$key is not set for this repository. Apply by hand: pnpm db:push $profile"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.env.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.env.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.env.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.env.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.env.outputs.configured == 'true'
        name: Apply migrations
        run: pnpm db:push ${{ steps.env.outputs.profile }}
