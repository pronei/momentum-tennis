<script type="text/babel">
const PORTAL_VIEWS=['portal','stats','calendar','bookings','store','profile'];
function Root(){
  const [h,setH]=React.useState((location.hash||'').replace('#',''));
  React.useEffect(()=>{
    const f=()=>setH((location.hash||'').replace('#',''));
    window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f);
  },[]);
  const isPortal=PORTAL_VIEWS.includes(h);
  React.useEffect(()=>{
    if(!isPortal){
      const el=h?document.getElementById(h):null;
      if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-84});
    }
  },[h,isPortal]);
  return isPortal?React.createElement(window.MTPortal.Portal,{key:'portal-'+h}):React.createElement(window.MTSections.HomePage,{key:'home'});
}
function mount(){
  const NS=window.MomentumTennisDesignSystem_0ea6ac;
  if(NS&&NS.SiteNav&&window.MTSections&&window.MTPortal){ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));}
  else{setTimeout(mount,200);}
}
mount();
</script></body></html>
