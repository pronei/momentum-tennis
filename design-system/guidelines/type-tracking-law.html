<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px 28px;background:var(--surface-card);color:var(--ink)}.half{display:grid;grid-template-columns:1fr 1fr;gap:32px}.rule{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--text-secondary);margin-bottom:12px;text-transform:uppercase}.lbl{font-family:var(--font-sans);font-weight:700;font-size:13px;letter-spacing:.107em;text-transform:uppercase}.lbl+.lbl{margin-top:8px;color:var(--court-500)}.disp{font-family:var(--font-display);font-weight:900;font-size:44px;letter-spacing:.01em;line-height:1.05;text-transform:uppercase}.bad{position:relative;color:var(--text-secondary);opacity:.55}.bad::after{content:"";position:absolute;left:0;right:0;top:52%;border-top:2px solid var(--court-500)}.foot{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);margin-top:16px}</style>

<div class="half">
<div><div class="rule">Speaking voice · ≤22px · 0.107em</div><div class="lbl">Book a free trial class</div><div class="lbl">JTT match schedule</div></div>
<div><div class="rule">Display · ≥28px · 0.01em</div><div class="disp">Momentum</div><div class="disp bad" style="letter-spacing:.107em;font-size:28px;margin-top:8px">Momentum</div></div>
</div>
<div class="foot">0.107EM WAS MEASURED OFF THE LEGACY SITE'S LABELS — THE ONE SYSTEMATIC THING IT HAD. IT NEVER TOUCHES DISPLAY SIZES.</div>
